<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script
			  src="https://code.jquery.com/jquery-4.0.0.min.js"
			  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
			  crossorigin="anonymous"></script>
  <link href = "css/style.css" rel="stylesheet" />
  <link rel="preload" as="image" href="assets\images\2308_desktop_hero.jpg" media="(min-width: 581px)">
  <link rel="preload" as="image" href="assets/images/2308_mobile_hero.jpg" media="(max-width: 580px)">
  <title>gogglebox</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body>
  <header class="gogglebox-header">
    <nav>
      <div id="gogglebox-logo">
        <a href="index.html">
          <img src="assets/images/2308_gogglebox_logo.png" alt="gogglebox logo">
        </a>
      </div>
      <div class="login">
        <button id="login-button" type="button">Sign In</button>
        <div id="login-form" class="hidden">
          <label for="username">Username:</label>
          <input id="username" type="text" style="width: 200px" />
          <label for="password">Password:</label>
          <input id="password" type="password" style="width: 200px" />
          <br /><br />
          <button type="button" id="cancel">Cancel</button>
      </div>
    </nav>
  </header>
  
  <main class = "content-container">
    <section class="hero-banner">
      <picture class="hero-image">
        <source srcset="assets\images\2308_desktop_hero.jpg" media="(min-width: 580px)" alt="Desktop Hero Image"/>
        <img src="assets/images/2308_mobile_hero.jpg" alt="Mobile Hero Image">
      </picture>
    </section>
    
    <section class="card-layout">
      <h2>Now Playing</h2>
      <div class="now-playing-flexbox">
        <div class="main-show">
          <img src="assets/images/2308_01_now_playing.jpg" alt="TV Maze Show">

        </div>
        <div class="stack-show">
          <img src="assets/images/2308_02_now_playing.jpg" alt="TV Maze Show">
          <img src="assets/images/2308_03_now_playing.jpg" alt="TV Maze Show">

        </div>
      </div>
    </section>
    
    <section class="tomorrows-schedule">
      <h2>Tomorrow's Schedule</h2>
      <div class="schedule-scroll">
        <ul class = "cards">
        </ul>
      </div>
    </section>
    
  </main>
    
  <footer class="gogglebox-footer">
    <div class = "copyright-text">
      <p>&copy; Gogglebox 2026 All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
<script src="js/script.js"></script>
